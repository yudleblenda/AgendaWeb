<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Agenda</title>

  <!-- Fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/login.css">
</head>

<body>

  <main class="login-container">

    <!-- IMAGEM -->

    <section class="login-image">

      <img src="../assets/image/imglogin.png" alt="Agenda">

    </section>

    <!-- CONTEÚDO -->

    <section class="login-content">

      <!-- LOGO -->

      <div class="logo">

        <img src="../assets/image/calendar.svg" alt="Logo">

        <span>
          Agenda<span class="blue-dot">.</span>
        </span>

      </div>

      <!-- TEXTO -->

      <div class="login-text">

        <h1>
          Bem vindo(a)
          <span>de volta!</span>
        </h1>

        <p>
          Faça login para continuar organizando
          seu tempo e alcançar mais.
        </p>

      </div>

      <!-- FORM -->

      <form class="login-form">

        <!-- EMAIL -->

        <div class="input-group">

          <label>E-mail</label>

          <input
            type="email"
            placeholder="seu@email.com"
          >

        </div>

        <!-- SENHA -->

        <div class="input-group">

          <label>Senha</label>

          <input
            type="password"
            placeholder="Sua senha"
          >

        </div>

        <!-- OPÇÕES -->

        <div class="login-options">

          <label class="remember">

            <input type="checkbox">

            Lembrar de mim

          </label>

          <a href="#">
            Esqueceu a senha?
          </a>

        </div>

        <!-- BOTÃO LOGIN -->

       <a href="home.html" class="btn-login" style="display: flex; align-items: center; justify-content: center; text-decoration: none;">
          Entrar
        </a>

        <!-- LINK CADASTRO -->

        <p class="register-link">

          Não possui conta?

          <a href="cadastro.html">
            Cadastre-se
          </a>

        </p>

      </form>

    </section>

  </main>

</body>

</html>
