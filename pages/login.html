<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Agenda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/login.css">
</head>

<body>

  <main class="container-fluid login-container">

    <div class="row align-items-center justify-content-center w-100">

      <section class="col-lg-8 d-none d-lg-flex justify-content-center login-image">
        <img src="../assets/image/imglogin.png" alt="Agenda">
      </section>

      <section class="col-12 col-md-8 col-lg-5 login-content">

        <div class="logo">
          <img src="../assets/image/calendar.svg" alt="Logo">
          <span>Agenda<span class="blue-dot">.</span></span>
        </div>

        <div class="login-text">
          <h1>
            Bem vindo(a)
            <span>de volta!</span>
          </h1>

          <p>
            Faça login para continuar organizando
            seu tempo e alcançar mais.
          </p>
        </div>

        <form class="login-form">

          <div class="form-group">
            <label for="email">E-mail</label>
            <div class="input-icon">
              <i data-lucide="mail"></i>

              <input
                id="email"
                name="email"
                type="email"
                class="form-control"
                placeholder="seu@email.com"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label for="senha">Senha</label>
            <div class="input-icon">
              <i data-lucide="lock"></i>

              <input
                id="senha"
                name="senha"
                type="password"
                class="form-control"
                placeholder="Sua senha"
                required
              >
            </div>
          </div>

          <div class="login-options">
            <label class="remember">
              <input type="checkbox" name="lembrar">
              Lembrar de mim
            </label>

            <a href="#">Esqueceu a senha?</a>
          </div>

          <a href="home.html" class="btn-login">
            Entrar
          </a>

          <p class="register-link">
            Não possui conta?
            <a href="cadastro.html">Cadastre-se</a>
          </p>

        </form>

      </section>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>

</body>
</html>
