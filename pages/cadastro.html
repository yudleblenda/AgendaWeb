<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro - Agenda</title>

  <!-- Fonte -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/cadastro.css">
</head>

<body>

  <main class="cadastro-container">

    <!-- LOGO -->

    <div class="logo">

      <img src="../assets/image/calendar.svg" alt="Logo Agenda">

      <span>
        Agenda<span class="blue-dot">.</span>
      </span>

    </div>

    <!-- TEXTO -->

    <div class="cadastro-text">

      <h1>
        Crie sua
        <span>conta.</span>
      </h1>

      <p>
        Preencha os dados abaixo para começar.
      </p>

    </div>

    <!-- FORM -->

    <form class="cadastro-form">

      <div class="form-grid">

        <!-- NOME -->

        <div class="input-group">

          <label>Nome completo</label>

          <input
            type="text"
            placeholder="Seu nome completo"
          >

        </div>

        <!-- EMAIL -->

        <div class="input-group">

          <label>E-mail</label>

          <input
            type="email"
            placeholder="seu@email.com"
          >

        </div>

        <!-- SENHA -->

        <div class="input-group">

          <label>Senha</label>

          <input
            type="password"
            placeholder="Sua senha"
          >

        </div>

        <!-- CONFIRMAR SENHA -->

        <div class="input-group">

          <label>Confirmar senha</label>

          <input
            type="password"
            placeholder="Sua senha"
          >

        </div>

      </div>

      <!-- OPÇÕES -->

      <div class="cadastro-options">

        <label class="remember">

          <input type="checkbox">

          Lembrar de mim

        </label>

        <a href="#">
          Esqueceu a senha?
        </a>

      </div>

      <!-- BOTÕES -->

      <div class="buttons">

         <button class="btn-cadastro">
          Criar conta
        </button>

        
      <a href="login.html" class="btn-login-link">

        Já possui conta?
        <span>Entrar</span>

      </a>

      </div>

    </form>

  </main>

</body>

</html>
