<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro - Agenda</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="../assets/css/cadastro.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>

<body>

  <main class="container cadastro-container">

    <div class="logo">
      <img src="../assets/image/calendar.svg" alt="Logo Agenda">

      <span>
        Agenda<span class="blue-dot">.</span>
      </span>
    </div>

    <div class="cadastro-text">
      <h1>
        Crie sua
        <span>conta.</span>
      </h1>

      <p>
        Preencha os dados abaixo para começar.
      </p>
    </div>

    <form class="cadastro-form">

      <div class="row g-4">

        <div class="col-12 col-md-6">
          <div class="form-group">
            <label for="nome">Nome completo</label>
            <div class="input-icon">
              <i data-lucide="user-round"></i>
            
              <input
                id="nome"
                name="nome"
                type="text"
                class="form-control"
                placeholder="Seu nome completo"
                required
                oninvalid="this.setCustomValidity('Digite seu nome completo')"
                oninput="this.setCustomValidity('')"
              >
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6">
          <div class="form-group">
            <label for="email">E-mail</label>
            <div class="input-icon">
              <i data-lucide="mail"></i>

              <input
                id="email"
                name="email"
                type="email"
                class="form-control"
                placeholder="seu@email.com"
                required
                oninvalid="this.setCustomValidity('Digite um e-mail válido')"
                oninput="this.setCustomValidity('')"
              >
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6">
          <div class="form-group">
            <label for="senha">Senha</label>
            <div class="input-icon">
              <i data-lucide="lock"></i>

              <input
                id="senha"
                name="senha"
                type="password"
                class="form-control"
                placeholder="Sua senha"
                required
                oninvalid="this.setCustomValidity('Digite sua senha')"
                oninput="this.setCustomValidity('')"
              >
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6">
          <div class="form-group">
            <label for="confirmarSenha">Confirmar senha</label>
            <div class="input-icon">
              <i data-lucide="lock"></i>

              <input
                id="confirmarSenha"
                name="confirmarSenha"
                type="password"
                class="form-control"
                placeholder="Sua senha"
                required
                oninvalid="this.setCustomValidity('Confirme sua senha')"
                oninput="this.setCustomValidity('')"
              >
            </div>
          </div>
        </div>

      </div>

      <div class="row g-3 buttons">
        <div class="col-12 col-md-6">
          <button type="submit" class="btn-cadastro">
            Criar conta
          </button>
        </div>

        <div class="col-12 col-md-6">
          <a href="login.html" class="btn-login-link">
            Já possui conta?
            <span>Entrar</span>
          </a>
        </div>
      </div>

    </form>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();
  </script>
  <script src="../assets/js/cadastro.js"></script>

</body>

</html>
